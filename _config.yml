# Keep internal files in Git, but omit them from the GitHub Pages/Jekyll site.
exclude:
  - AGENTS.md
  - "**/AGENTS.md"
  - README.md
  - "**/README.md"
  - "프로젝트.md"
  - "이미지요청.md"
  - "공통지침.md"
  - "프로젝트지침.md"
  # Working files: generated pictures are processed into images/ before they are used.
  - "자료실/"
  - docs/
  # Source data and the page build script (the generated index-*.html files are published).
  - data/
  - tools/
  - content/
  - .idea/
  - .agents/
  - .codex/
  - .github/
  # Preserve Jekyll 3's default exclusions when overriding exclude.
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
