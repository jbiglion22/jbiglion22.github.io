<script>
const supported = ['en', 'ko', 'vi', 'hi', 'id', 'es-mx'];
let selected = 'en';
for (const preference of navigator.languages || [navigator.language || 'en']) {
  const locale = preference.toLowerCase();
  const base = locale.split('-')[0];
  const candidate = supported.includes(locale) ? locale : base === 'es' ? 'es-mx' : base === 'in' ? 'id' : base;
  if (supported.includes(candidate)) { selected = candidate; break; }
}
location.replace('index-' + selected + '.html' + location.search + location.hash);
